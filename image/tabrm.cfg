{
    // QNX tabrm (TPM access broker and resource manager) on top of a real TIS TPM:
    // tabrm -> libtss2-tcti-witness -> /dev/tpm0 (dev-tpm-tis) -> TPM.
    // Clients use /dev/tpmrm0 through libtcti_tabrm, the tctildr default on QNX.
    "background": true,
    "dev_path_name": "/dev/tpmrm0",
    "tcti_module_name": "/system/lib/libtss2-tcti-witness.so.0",
    "rm_module_name": "tabrm_rm_mod_intel.so",
    "tcti_mod_config": "/dev/tpm0",
    "rm_mod_config": {
        "flush_all_sessions": true,
        "max_sessions": 16,
        "max_transient_objects": 27
    }
}
