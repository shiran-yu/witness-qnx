[project]
name = "witness"
version = "0.1.0"
description = "Host-side reference values, verifier and dashboard for Witness (TPM attestation for QNX 8.0)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
witness = "witness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
